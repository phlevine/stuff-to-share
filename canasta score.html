<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Canasta Score Sheet</title>

<style>
  body {
    font-family: sans-serif;
    margin: 0;
    padding: 0;
    background: #fafafa;
  }

  /* Auto-scale container */
  #page {
    width: 100%;
    max-width: 100%;
    margin: auto;
    background: white;
    padding: 14px;
    box-sizing: border-box;
  }

  h1 {
    text-align: center;
    font-size: 1.4em;
    margin-top: 5px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    table-layout: fixed;
  }

  th, td {
    border: 1px solid #ccc;
    padding: 4px;
    font-size: 0.85em;
    text-align: center;
    box-sizing: border-box;
    word-wrap: break-word;
  }

  th {
    background: #f2f2f2;
  }

  thead th {
    position: sticky;
    top: 0;
    z-index: 20;
    background: #f2f2f2;
  }

  tbody tr:nth-child(odd) { background: #ffffff; }
  tbody tr:nth-child(even) { background: #f9f9f9; }

  /* Responsive input boxes */
  input[type="text"] {
    width: 100%;
    max-width: 60px;
    min-width: 40px;
    font-size: 0.9em;
    padding: 2px;
    text-align: right;
    box-sizing: border-box;
  }

  .winner {
    font-size: 1.2em;
    text-align: center;
    margin-top: 12px;
    color: darkgreen;
    font-weight: bold;
  }

  .team-header {
    background: #e3f4ff;
  }

  .women-col { background: #f7fbff; }
  .men-col { background: #fff7f7; }

  #teamInputs {
    text-align: center;
    margin-bottom: 10px;
  }

  #teamInputs input {
    font-size: 1em;
    padding: 4px;
    margin: 4px;
    width: 160px;
    max-width: 40%;
    text-align: center;
    box-sizing: border-box;
  }

  .subrow {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 4px 0;
    flex-wrap: wrap;
  }

  .score-label {
    font-size: 0.75em;
    color: #555;
    display: block;
    margin-top: 1px;
  }

  .roundScore {
    font-size: 1.1em;
    font-weight: bold;
  }

  .runningScore {
    font-size: 1.1em;
    font-weight: bold;
    color: #0044cc;
  }

  /* Three buttons in one responsive row */
  #buttonRow {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  #buttonRow button {
    flex: 1 1 30%;
    padding: 8px;
    font-size: 1em;
    background: #1976d2;
    color: white;
    border: none;
    border-radius: 5px;
    box-sizing: border-box;
  }

  #buttonRow button:nth-child(2) {
    background: #8e24aa;
  }

  #buttonRow button:nth-child(3) {
    background: #b71c1c;
  }

  #buttonRow button:active {
    filter: brightness(0.9);
  }
</style>
</head>

<body>
<div id="page">

<h1>Canasta Score Sheet (7.19.10)</h1>
<p style="text-align:center;">8500 wins.</p>

<div id="teamInputs">
  <input id="teamAName" placeholder="Team A Name">
  <input id="teamBName" placeholder="Team B Name">
  <button onclick="saveTeamNames()">Save Names</button>
</div>

<table id="scoreTable">
  <thead>
    <tr>
      <th style="width:50px;">Rnd</th>
      <th colspan="4" class="team-header" id="teamAHeader">Team A</th>
      <th colspan="4" class="team-header" id="teamBHeader">Team B</th>
    </tr>
    <tr>
      <th></th>
      <th colspan="4">Round Inputs</th>
      <th colspan="4">Round Inputs</th>
    </tr>
  </thead>

  <tbody id="scoreBody"></tbody>
</table>

<div id="buttonRow">
  <button onclick="addRound()">Add Round</button>
  <button onclick="deleteEmptyRounds()">Delete Empty</button>
  <button onclick="resetGame()">Reset Game</button>
</div>

<div id="winnerMsg" class="winner"></div>

<script>
let roundCount = 0;
const WINNING_SCORE = 8500;

/* Team Names */
function loadTeamNames() {
  const a = localStorage.getItem('teamAName') || "Team A";
  const b = localStorage.getItem('teamBName') || "Team B";

  document.getElementById('teamAName').value = a;
  document.getElementById('teamBName').value = b;

  document.getElementById('teamAHeader').textContent = a;
  document.getElementById('teamBHeader').textContent = b;
}

function saveTeamNames() {
  const a = document.getElementById('teamAName').value.trim() || "Team A";
  const b = document.getElementById('teamBName').value.trim() || "Team B";

  localStorage.setItem('teamAName', a);
  localStorage.setItem('teamBName', b);

  document.getElementById('teamAHeader').textContent = a;
  document.getElementById('teamBHeader').textContent = b;

  recalculate();
}

/* Persistent Storage */
function saveState() {
  const rows = [...document.querySelectorAll('#scoreBody tr')].map(row => {
    return {
      extraA: row.querySelector('.extraA').value,
      threesA: row.querySelector('.threesA').value,
      canastasA: row.querySelector('.canastasA').value,
      specialA: row.querySelector('.specialA').value,
      cardA: row.querySelector('.cardA').value,
      deductA: row.querySelector('.deductA').value,

      extraB: row.querySelector('.extraB').value,
      threesB: row.querySelector('.threesB').value,
      canastasB: row.querySelector('.canastasB').value,
      specialB: row.querySelector('.specialB').value,
      cardB: row.querySelector('.cardB').value,
      deductB: row.querySelector('.deductB').value
    };
  });

  localStorage.setItem('canastaScores', JSON.stringify(rows));
}

function loadState() {
  const saved = localStorage.getItem('canastaScores');
  if (!saved) {
    addRound();
    return;
  }

  const rows = JSON.parse(saved);
  rows.forEach(data => {
    addRound();
    const row = document.querySelector(`#scoreBody tr:last-child`);

    row.querySelector('.extraA').value = data.extraA;
    row.querySelector('.threesA').value = data.threesA;
    row.querySelector('.canastasA').value = data.canastasA;
    row.querySelector('.specialA').value = data.specialA;
    row.querySelector('.cardA').value = data.cardA;
    row.querySelector('.deductA').value = data.deductA;

    row.querySelector('.extraB').value = data.extraB;
    row.querySelector('.threesB').value = data.threesB;
    row.querySelector('.canastasB').value = data.canastasB;
    row.querySelector('.specialB').value = data.specialB;
    row.querySelector('.cardB').value = data.cardB;
    row.querySelector('.deductB').value = data.deductB;
  });

  renumberRounds();
  recalculate();
}

/* Renumber Rounds */
function renumberRounds() {
  const rows = document.querySelectorAll('#scoreBody tr');
  let i = 1;
  rows.forEach(row => {
    row.querySelector('.roundNum').textContent = i;
    row.dataset.round = i;
    i++;
  });
  roundCount = rows.length;
}

/* Reset Game */
function resetGame() {
  if (!confirm("Reset the entire game and clear all scores?")) return;

  localStorage.removeItem('canastaScores');
  document.getElementById('scoreBody').innerHTML = "";
  roundCount = 0;
  addRound();
  renumberRounds();
  document.getElementById('winnerMsg').textContent = "";
}

/* Delete Empty Rounds */
function deleteEmptyRounds() {
  const rows = document.querySelectorAll('#scoreBody tr');
  let deleted = false;

  rows.forEach(row => {
    const inputs = row.querySelectorAll('input[type="text"]');
    const allBlank = [...inputs].every(i => i.value.trim() === "");

    if (allBlank) {
      row.remove();
      deleted = true;
    }
  });

  if (deleted) {
    renumberRounds();
    recalculate();
    saveState();
  }
}

/* Add Round */
function addRound() {
  roundCount++;
  const tbody = document.getElementById('scoreBody');
  const tr = document.createElement('tr');
  tr.dataset.round = roundCount;

  tr.innerHTML = `
    <td class="roundNum">${roundCount}</td>

    <td colspan="4" class="women-col">
      <div class="subrow">
        <input type="text" inputmode="numeric" pattern="-?[0-9]*" class="extraA" placeholder="Extra">
        <input type="text" inputmode="numeric" pattern="-?[0-9]*" class="threesA" placeholder="Threes">
        <input type="text" inputmode="numeric" pattern="-?[0-9]*" class="canastasA" placeholder="Canastas">
        <input type="text" inputmode="numeric" pattern="-?[0-9]*" class="specialA" placeholder="Special">
      </div>
      <div class="subrow">
        <input type="text" inputmode="numeric" pattern="-?[0-9]*" class="cardA" placeholder="Card">
        <input type="text" inputmode="numeric" pattern="-?[0-9]*" class="deductA" placeholder="Deduct">
        <div>
          <span class="roundScore roundTotalA">0</span>
          <span class="score-label">Round</span>
        </div>
        <div>
          <span class="runningScore runningTotalA">0</span>
          <span class="score-label">Running</span>
        </div>
      </div>
    </td>

    <td colspan="4" class="men-col">
      <div class="subrow">
        <input type="text" inputmode="numeric" pattern="-?[0-9]*" class="extraB" placeholder="Extra">
        <input type="text" inputmode="numeric" pattern="-?[0-9]*" class="threesB" placeholder="Threes">
        <input type="text" inputmode="numeric" pattern="-?[0-9]*" class="canastasB" placeholder="Canastas">
        <input type="text" inputmode="numeric" pattern="-?[0-9]*" class="specialB" placeholder="Special">
      </div>
      <div class="subrow">
        <input type="text" inputmode="numeric" pattern="-?[0-9]*" class="cardB" placeholder="Card">
        <input type="text" inputmode="numeric" pattern="-?[0-9]*" class="deductB" placeholder="Deduct">
        <div>
          <span class="roundScore roundTotalB">0</span>
          <span class="score-label">Round</span>
        </div>
        <div>
          <span class="runningScore runningTotalB">0</span>
          <span class="score-label">Running</span>
        </div>
      </div>
    </td>
  `;

  tbody.appendChild(tr);

  tr.querySelectorAll('input[type="text"]').forEach(input => {
    input.value = "";
  });

  tr.querySelectorAll('input').forEach(input => {
    input.addEventListener('input', () => { recalculate(); saveState(); });
    input.addEventListener('change', () => { recalculate(); saveState(); });
  });

  recalculate();
  saveState();

  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

/* Scoring Logic */
function getNumber(v) {
  const n = parseInt(v, 10);
  return isNaN(n) ? 0 : n;
}

function recalculate() {
  const rows = document.querySelectorAll('#scoreBody tr');
  let runningA = 0;
  let runningB = 0;
  let winnerText = '';

  const teamA = localStorage.getItem('teamAName') || "Team A";
  const teamB = localStorage.getItem('teamBName') || "Team B";

  rows.forEach(row => {
    const extraA = getNumber(row.querySelector('.extraA').value);
    const threesA = getNumber(row.querySelector('.threesA').value);
    const canastasA = getNumber(row.querySelector('.canastasA').value);
    const specialA = getNumber(row.querySelector('.specialA').value);
    const cardA = getNumber(row.querySelector('.cardA').value);
    const deductA = getNumber(row.querySelector('.deductA').value);

    const roundTotalA =
      extraA + threesA + canastasA + specialA + cardA - deductA;
    runningA += roundTotalA;

    const rtA = row.querySelector('.roundTotalA');
    rtA.textContent = roundTotalA;
    rtA.style.color = roundTotalA > 0 ? 'green' : roundTotalA < 0 ? 'red' : 'black';

    row.querySelector('.runningTotalA').textContent = runningA;

    const extraB = getNumber(row.querySelector('.extraB').value);
    const threesB = getNumber(row.querySelector('.threesB').value);
    const canastasB = getNumber(row.querySelector('.canastasB').value);
    const specialB = getNumber(row.querySelector('.specialB').value);
    const cardB = getNumber(row.querySelector('.cardB').value);
    const deductB = getNumber(row.querySelector('.deductB').value);

    const roundTotalB =
      extraB + threesB + canastasB + specialB + cardB - deductB;
    runningB += roundTotalB;

    const rtB = row.querySelector('.roundTotalB');
    rtB.textContent = roundTotalB;
    rtB.style.color = roundTotalB > 0 ? 'green' : roundTotalB < 0 ? 'red' : 'black';

    row.querySelector('.runningTotalB').textContent = runningB;
  });

  if (runningA >= WINNING_SCORE || runningB >= WINNING_SCORE) {
    winnerText =
      runningA > runningB ? `${teamA} win with ${runningA} points` :
      runningB > runningA ? `${teamB} win with ${runningB} points` :
      `Tie game at ${runningA} points`;
  }

  document.getElementById('winnerMsg').textContent = winnerText;
}

/* Initialize */
loadTeamNames();
loadState();
</script>

</div>
</body>
</html>
